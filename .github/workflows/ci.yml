name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]          # a version tag also publishes a GitHub Release (see "publish")
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.11"
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: pip install pytest

      - name: Install a browser for the extension test (Linux)
        if: runner.os == 'Linux'
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run tests
        shell: bash
        env:
          # The browser test saves its screenshots of the popup and welcome page here
          WHEREFROM_SCREENSHOTS: ${{ runner.temp }}/screenshots
        run: |
          set -o pipefail
          # On Linux, a virtual display lets the window and real-browser tests run
          if [ "$RUNNER_OS" = "Linux" ]; then run="xvfb-run -a"; else run=""; fi
          $run python -m pytest -v -rs 2>&1 | tee test-output.txt

      - name: Keep the extension screenshots
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: extension-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore

      - name: Post the test summary
        if: always()
        shell: bash
        run: |
          [ -f test-output.txt ] || exit 0
          grep -E "[0-9]+ (passed|failed|skipped)|^SKIPPED" test-output.txt \
            | tail -n 8 | while IFS= read -r line; do echo "::notice::${line:0:400}"; done

      - name: Show failures as annotations
        if: failure()
        shell: bash
        run: |
          [ -f test-output.txt ] || exit 0
          # Each failure's own error lines ("E ...") first, so none is crowded out
          { grep -E '^(E  |FAILED)' test-output.txt || true; grep -E 'Error|Traceback|failed' test-output.txt || true; tail -n 5 test-output.txt; } \
            | awk '!seen[$0]++' | head -n 40 | while IFS= read -r line; do echo "::error::${line:0:400}"; done

  build:
    # The two .exe files: wherefrom.exe for the command line, wherefromw.exe
    # (no console window) for the right-click menu and start at login. Plus
    # wherefrom-setup.exe, the installer, which is installed, upgraded and
    # uninstalled for real on this machine.
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build
        shell: bash
        run: |
          pip install pyinstaller==6.22.3
          # The browser extension's files travel inside the programs
          pyinstaller --onefile --icon packaging/wherefrom.ico --name wherefrom --paths . --add-data "wherefrom/extension;wherefrom/extension" packaging/entry.py
          pyinstaller --onefile --noconsole --icon packaging/wherefrom.ico --name wherefromw --paths . --add-data "wherefrom/extension;wherefrom/extension" packaging/entry.py
          # The folder build the installer ships: starts much faster (nothing to unpack first)
          pyinstaller --noconfirm --workpath build/folder --distpath dist/app packaging/wherefrom.spec

      - name: Check the built program
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:WHEREFROM_HOME = "$env:RUNNER_TEMP\wf-home"
          .\dist\wherefrom.exe --version
          if ($LASTEXITCODE -ne 0) { throw "--version failed" }
          # A file with a real Mark of the Web, like a browser would leave
          $file = "$env:RUNNER_TEMP\report.pdf"
          Set-Content -Path $file -Value "pdf bytes"
          Set-Content -Path $file -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3`r`nHostUrl=https://example.com/report.pdf"
          $out = .\dist\wherefrom.exe show $file | Out-String
          Write-Output $out
          if ($out -notmatch "https://example.com/report.pdf") { throw "show didn't find the source" }
          # A renamed copy without the mark is still traced by its contents
          $copy = "$env:RUNNER_TEMP\renamed copy.pdf"
          Copy-Item $file $copy -Force
          Remove-Item -Path $copy -Stream Zone.Identifier
          $out = .\dist\wherefrom.exe show $copy | Out-String
          Write-Output $out
          if ($out -notmatch "https://example.com/report.pdf") { throw "the copy wasn't traced" }
          Write-Output "::notice::Built wherefrom.exe; it read a real Mark of the Web and traced a renamed copy"

      - name: Build the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Find-Iscc { Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 }
          $iscc = Find-Iscc
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = Find-Iscc
          }
          if (-not $iscc) { throw "Inno Setup's compiler (ISCC.exe) wasn't found" }
          Write-Output "Using $($iscc.FullName)"
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          & $iscc.FullName "/DAppVersion=$version" "/DDistDir=$PWD\dist\app\wherefrom" "/O$PWD\dist" packaging\wherefrom.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Install, upgrade and uninstall it
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $expected = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          $app = "$env:LOCALAPPDATA\Programs\wherefrom"
          $menu = "HKCU:\Software\Classes\*\shell\wherefrom\command"
          $run = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          $hostKey = "HKCU:\Software\Google\Chrome\NativeMessagingHosts\com.wherefrom.host"
          $entry = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{7C3BDB2F-EBD8-4BDC-A175-DB3BD43452B7}_is1"
          function Wait-Until([string]$what, [scriptblock]$ok, [int]$seconds = 60) {
            $deadline = (Get-Date).AddSeconds($seconds)
            while (-not (& $ok)) {
              if ((Get-Date) -gt $deadline) { throw "Timed out waiting for: $what" }
              Start-Sleep -Milliseconds 500
            }
          }
          function Watchers { @(Get-Process wherefromw -ErrorAction SilentlyContinue).Count }
          function Install-Once([string]$log, [string]$setup = "dist\wherefrom-setup.exe") {
            # -PassThru + WaitForExit: -Wait would also wait for the watcher it starts, forever
            $p = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=$log" -PassThru
            $null = $p.Handle       # without this, ExitCode can come back empty
            $p.WaitForExit()
            if ($p.ExitCode -ne 0) { Get-Content $log -Tail 30; throw "the installer exited with $($p.ExitCode)" }
          }
          function Check-Installed {
            if (-not (Test-Path "$app\wherefrom.exe") -or -not (Test-Path "$app\wherefromw.exe")) { throw "programs missing" }
            $log = Get-Content "$app\setup.log" -Raw
            Write-Output $log
            if ($log -notmatch "Done\.") { throw "wherefrom setup didn't finish" }
            $command = (Get-ItemProperty -LiteralPath $menu).'(default)'
            if ($command -notlike "*$app\wherefromw.exe*show --gui*") { throw "menu entry: $command" }
            $atLogin = (Get-ItemProperty -LiteralPath $run).wherefrom
            if ($atLogin -notlike "*$app\wherefromw.exe*watch") { throw "start at sign-in: $atLogin" }
            if (-not (Test-Path -LiteralPath $hostKey)) { throw "browser connection missing" }
            if (-not (Test-Path -LiteralPath $entry)) { throw "Apps & features entry missing" }
            if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\wherefrom.lnk")) { throw "Start menu entry missing" }
            Wait-Until "the watcher to run" { (Watchers) -ge 1 }
            $version = & "$app\wherefrom.exe" --version
            if ($LASTEXITCODE -ne 0) { throw "--version failed" }
            Write-Output "Installed: $version"
          }
          function Check-ThisVersion {
            $version = & "$app\wherefrom.exe" --version
            if ($version -ne "wherefrom $expected") { throw "expected wherefrom $expected, got $version" }
            if (-not (Test-Path "$app\_internal")) { throw "the folder build's _internal is missing" }
            # The installed program reads a real Mark of the Web
            $file = "$env:RUNNER_TEMP\installed-check.pdf"
            Set-Content -Path $file -Value "installed check $(Get-Random)"
            Set-Content -Path $file -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3`r`nHostUrl=https://example.com/installed.pdf"
            $out = & "$app\wherefrom.exe" show $file | Out-String
            if ($out -notmatch "https://example.com/installed.pdf") { throw "the installed program didn't read the mark: $out" }
            # The browser's way in: a framed "ping" through the installed helper, as Chrome sends it
            $bat = "$env:LOCALAPPDATA\wherefrom\browser\wherefrom-host.bat"
            $psi = [Diagnostics.ProcessStartInfo]::new("cmd.exe", "/d /c `"`"$bat`" chrome-extension://oihchieldoakdhphjlofnphcpmmiooka/`"")
            $psi.RedirectStandardInput = $true; $psi.RedirectStandardOutput = $true; $psi.UseShellExecute = $false
            $h = [Diagnostics.Process]::Start($psi)
            $body = [Text.Encoding]::UTF8.GetBytes('{"type":"ping"}')
            $h.StandardInput.BaseStream.Write([BitConverter]::GetBytes([int]$body.Length), 0, 4)
            $h.StandardInput.BaseStream.Write($body, 0, $body.Length)
            $h.StandardInput.Close()
            $buffer = [IO.MemoryStream]::new()
            $h.StandardOutput.BaseStream.CopyTo($buffer)
            $h.WaitForExit()
            $bytes = $buffer.ToArray()
            if ($bytes.Length -lt 4) { throw "the browser helper didn't answer" }
            $reply = [Text.Encoding]::UTF8.GetString($bytes, 4, [BitConverter]::ToInt32($bytes, 0)) | ConvertFrom-Json
            if (-not $reply.ok -or $reply.version -ne $expected) { throw "the browser helper answered: $($reply | ConvertTo-Json -Compress)" }
            # How fast it starts, against the single-file program (median of 3 warm runs)
            function Median-Start([string]$exe) {
              & $exe --version | Out-Null
              $times = 1..3 | ForEach-Object { (Measure-Command { & $exe --version | Out-Null }).TotalSeconds } | Sort-Object
              return $times[1]
            }
            $installed = Median-Start "$app\wherefrom.exe"
            $single = Median-Start "dist\wherefrom.exe"
            Write-Output ("::notice::Startup: installed folder build {0:N2} s, single-file program {1:N2} s" -f $installed, $single)
            if ($installed -gt 2) { throw ("the installed program took {0:N2} s to start" -f $installed) }
          }

          # Start from the last release, as most people will
          gh release download v0.3.0 --repo $env:GITHUB_REPOSITORY --pattern wherefrom-setup.exe --dir "$env:RUNNER_TEMP\old"
          Install-Once "$env:RUNNER_TEMP\old-install.log" "$env:RUNNER_TEMP\old\wherefrom-setup.exe"
          Check-Installed
          # Upgrade it to this build
          Install-Once "$env:RUNNER_TEMP\install.log"
          Check-Installed
          Check-ThisVersion
          # Again, over the running watcher
          Install-Once "$env:RUNNER_TEMP\upgrade.log"
          Check-Installed
          Check-ThisVersion

          # The uninstaller copies itself to TEMP and returns at once, so wait for its work
          $u = Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -PassThru
          $u.WaitForExit()
          Wait-Until "the uninstaller to finish" { -not (Test-Path -LiteralPath $entry) -and -not (Test-Path "$app\wherefrom.exe") } 120
          Wait-Until "the program folder to be removed" { -not (Test-Path "$app\_internal") } 60
          Wait-Until "the watcher to stop" { (Watchers) -eq 0 }
          if (Test-Path -LiteralPath $menu) { throw "menu entry left behind" }
          if ((Get-ItemProperty -LiteralPath $run).PSObject.Properties.Name -contains "wherefrom") { throw "start at sign-in left behind" }
          if (Test-Path -LiteralPath $hostKey) { throw "browser connection left behind" }
          if (-not (Test-Path "$env:LOCALAPPDATA\wherefrom\ledger.sqlite3")) { throw "the database should be kept" }
          Write-Output "::notice::wherefrom-setup.exe upgraded v0.3.0, upgraded again over a running watcher, answered the browser's ping, and uninstalled cleanly"

      - uses: actions/upload-artifact@v7
        with:
          name: wherefrom-windows
          path: |
            dist/wherefrom.exe
            dist/wherefromw.exe
            dist/wherefrom-setup.exe

  extension:
    # The extension's store packages (Chrome Web Store / Edge, Firefox)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build the store packages
        run: python packaging/build_extension.py dist/extension

      - name: Check the Firefox package with Mozilla's linter (what addons.mozilla.org runs)
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          mkdir -p "$RUNNER_TEMP/firefox"
          unzip -q "dist/extension/wherefrom-firefox-$version.zip" -d "$RUNNER_TEMP/firefox"
          npx --yes web-ext@8 lint --source-dir "$RUNNER_TEMP/firefox" --output json --pretty > lint.json || true
          python3 - <<'PY'
          import json
          report = json.load(open("lint.json"))
          for kind in ("errors", "warnings", "notices"):
              for m in report.get(kind, []):
                  level = "error" if kind == "errors" else "warning" if kind == "warnings" else "notice"
                  print(f"::{level}::web-ext {m.get('code')}: {m.get('message')} ({m.get('file', '')})")
          print("summary:", report.get("summary"))
          raise SystemExit(1 if report.get("errors") else 0)
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: wherefrom-extension
          path: dist/extension/*.zip

  release-files:
    # Everything a release would publish, gathered and checked on every run, so
    # a broken release shows up on the pull request rather than on the tag.
    needs: [build, extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Gather and check
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but pyproject.toml says version $version"
            exit 1
          fi
          mkdir release
          cp artifacts/wherefrom-windows/wherefrom-setup.exe artifacts/wherefrom-windows/wherefrom.exe artifacts/wherefrom-windows/wherefromw.exe release/
          cp artifacts/wherefrom-extension/wherefrom-chromium-$version.zip release/
          cp artifacts/wherefrom-extension/wherefrom-firefox-$version.zip release/
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -l release
          cat release/SHA256SUMS.txt
          echo "::notice::Release files for $version are ready: $(ls release | xargs)"

      - uses: actions/upload-artifact@v7
        with:
          name: wherefrom-release
          path: release/*

  publish:
    # Only for a pushed version tag such as v0.2.0
    if: "startsWith(github.ref, 'refs/tags/v')"
    needs: release-files
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: wherefrom-release
          path: release

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "wherefrom ${GITHUB_REF_NAME#v}" --generate-notes
